<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CipherLeaf sealed envelope">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3ef"/>
      <stop offset="45%" stop-color="#f3f6f3"/>
      <stop offset="100%" stop-color="#e8efe9"/>
    </linearGradient>
    <linearGradient id="flap" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d7e4db"/>
      <stop offset="100%" stop-color="#c5d0c8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c5d0c8" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="120" cy="80" r="180" fill="#d7e4db" opacity="0.55"/>
  <circle cx="1100" cy="40" r="160" fill="#cfdcd3" opacity="0.5"/>

  <!-- envelope body -->
  <g transform="translate(300 145)">
    <rect x="0" y="70" width="600" height="340" rx="6" fill="#f7faf7" stroke="#2f5d50" stroke-width="3"/>
    <path d="M0 70 L300 260 L600 70" fill="url(#flap)" stroke="#2f5d50" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 70 L300 220 L600 70" fill="none" stroke="#4f7d62" stroke-width="2" opacity="0.7"/>
    <!-- wax seal -->
    <circle cx="300" cy="210" r="36" fill="#2f5d50"/>
    <circle cx="300" cy="210" r="26" fill="none" stroke="#f3f6f3" stroke-width="2" opacity="0.85"/>
    <path d="M292 222 C292 206 308 206 308 222 C308 234 300 240 300 240 C300 240 292 234 292 222 Z" fill="#f3f6f3" opacity="0.95"/>
  </g>

  <text x="600" y="545" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#15201c">CipherLeaf</text>
  <text x="600" y="585" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="6" fill="#2f5d50">SEALED MANUSCRIPT</text>
</svg>
